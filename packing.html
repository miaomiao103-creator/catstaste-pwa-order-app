<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>CatsTaste 執貨後台</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon-192.png" type="image/png" />
  <link rel="stylesheet" href="./assets/css/packing.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <a class="logo" href="./index.html"><img src="./brand-logo.png" alt="CatsTaste" /></a>
      <div>
        <h1>CatsTaste 執貨後台</h1>
        <div class="subtitle">同事專用 · 只睇要執咩貨 · 有網更新，冇網用快取</div>
      </div>
    </div>
    <div class="status">
      <button id="reloadPageBtn" type="button" class="pill">重新整理</button>
      <span id="onlinePill" class="pill">連線檢查中</span>
      <span id="cachePill" class="pill info">未更新</span>
      <a class="pill" href="./order.html">返回落單台</a>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="hero-head">
        <div>
          <h2>待執貨清單</h2>
          <p>同事只需要開呢頁，就可以睇 Google Sheet 內待執貨訂單要執邊啲 SKU、幾多件、屬於邊張單。訂單會按時間排序；入到收唔到網位置都可以用最後一次快取。</p>
        </div>
        <div class="hero-actions">
          <button id="refreshBtn" type="button">更新待執貨清單</button>
          <button id="useCacheBtn" class="secondary" type="button">使用離線快取</button>
        </div>
      </div>
      <div class="stats">
        <div class="stat"><span>今日訂單</span><strong id="orderCount">0</strong></div>
        <div class="stat"><span>要執 SKU</span><strong id="skuCount">0</strong></div>
        <div class="stat"><span>未寄出</span><strong id="followCount">0</strong></div>
        <div class="stat"><span>快取時間</span><strong id="cacheTime">-</strong></div>
      </div>
    </section>

    <section class="card">
      <div class="view-switch" id="viewSwitch">
        <button type="button" class="active" data-view="packing">執貨清單</button>
        <button type="button" data-view="orders">訂單處理</button>
      </div>
      <div class="toolbar-row">
        <div class="filter-row" id="filterRow">
          <button type="button" class="active" data-filter="all">全部</button>
          <button type="button" data-filter="box">原箱</button>
          <button type="button" data-filter="unit">單件</button>
          <button type="button" data-filter="note">有備註</button>
          <button type="button" data-filter="unshipped">未寄出</button>
        </div>
        <button type="button" id="sortBtn" class="sort-btn">數量優先</button>
      </div>
      <div id="statusLine" class="status-line">未下載資料。請有網時按「更新待執貨清單」。</div>
      <div id="packingList" class="packing-list"></div>
      <div id="ordersBoard" class="orders-board" hidden></div>
    </section>
  </main>

  <button type="button" id="scrollTopBtn" class="scroll-top-btn hidden" aria-label="返回最上">↑</button>

  <div id="verifyModal" class="verify-modal hidden" role="dialog" aria-modal="true" aria-label="核實賬單">
    <div class="verify-panel">
      <div>
        <h2 id="verifyTitle" style="margin:0;color:var(--ink)">核實賬單</h2>
        <div id="verifyMeta" class="verify-meta"></div>
      </div>
      <div id="verifyItems" class="verify-items"></div>
      <div id="verifyNotes" class="verify-meta"></div>

      <div class="verify-form-grid">
        <div>
          <label for="verifyCourierCompany">快遞公司</label>
          <select id="verifyCourierCompany">
            <option value="">請選擇</option>
            <option value="SF Express">SF Express</option>
            <option value="JD Logistics">JD Logistics</option>
            <option value="Hongkong Post">Hongkong Post</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div>
          <label for="verifyTrackingNo">快遞單號</label>
          <input id="verifyTrackingNo" placeholder="可掃描 / 手動輸入" autocomplete="off" />
        </div>
      </div>

      <div class="verify-scanner-actions">
        <button type="button" class="secondary" id="startScanBtn">掃描 barcode / QR code</button>
        <button type="button" class="secondary hidden" id="stopScanBtn">停止掃描</button>
        <button type="button" class="secondary" id="copyShipNoticeBtn">複製出貨通知</button>
      </div>

      <div id="scannerWrap" class="scanner-wrap hidden">
        <video id="scanVideo" playsinline muted></video>
        <div class="scanner-hint">將快遞單號 barcode / QR code 對準鏡頭中央；如裝置不支援，請手動輸入。</div>
      </div>

      <div>
        <label for="shipNoticePreview">WhatsApp 出貨通知預覽</label>
        <textarea id="shipNoticePreview" readonly></textarea>
      </div>

      <div class="verify-actions">
        <button type="button" class="secondary" id="verifyCloseBtn">關閉</button>
        <button type="button" id="verifyConfirmBtn">確認已寄出</button>
      </div>
    </div>
  </div>
  <script src="./assets/js/packing.js"></script>
</body>
</html>
