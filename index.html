<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#87a9f6" />
  <title>CatsTaste App 入口</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./assets/css/index.css" />
</head>
<body>
  <div class="page">
    <div class="topbar">
      <button type="button" class="refresh-btn" id="reloadPageBtn">重新整理</button>
    </div>

    <div class="shell">
      <div class="hero">
        <div class="logo"><img src="./brand-logo.png" alt="CatsTaste" /></div>
        <h1>CatsTaste</h1>
        <p>請先輸入名字同設備名稱，再選擇進入新送貨單或執貨後台。</p>
        <div class="status-bar">
          <span class="pill ok" id="onlinePill">連線中</span>
          <span class="pill" id="deviceModelPill">裝置: -</span>
        </div>
      </div>

      <div class="card">
        <h2>開始使用</h2>
        <p class="copy">名字同設備名稱都只接受英文字母或數字，方便現場快速識別。</p>
        <div class="form-grid">
          <div>
            <label for="staffName">名字</label>
            <input id="staffName" inputmode="latin" autocomplete="off" placeholder="例如 Vicky01" />
            <div class="hint">只可輸入英文或數字</div>
          </div>
          <div>
            <label for="deviceName">設備名稱</label>
            <input id="deviceName" inputmode="latin" autocomplete="off" placeholder="例如 IPHONE15A" />
            <div class="hint">只可輸入英文或數字</div>
          </div>
        </div>
        <div class="actions">
          <button type="button" class="primary-btn" id="openOrderBtn">新送貨單</button>
          <button type="button" class="secondary-btn" id="openPackingBtn">執貨後台</button>
        </div>
        <div id="message" class="message"></div>
      </div>
    </div>
  </div>

  <button type="button" id="scrollTopBtn" class="scroll-top-btn hidden" aria-label="返回最上">↑</button>
  <script src="./assets/js/index.js"></script>
</body>
</html>
